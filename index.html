    <textarea id="CodeInput" placeholder="Input your Code here!" style="height: 40%; width: 40%; resize: none;" ></textarea>
    <button id="RunCode" style="height: 100px; width: 100px;">RUN</button>
    <pre id="Visualise"></pre>
    <pre id="VStacks"></pre>
    <pre id="InstructionVisualiser" style="background-color: rgb(187, 187, 187); color: rgb(0, 0, 0); position: absolute; right: 5%; top: 0.1%; height: 45%; width: 15%; font-size: 15px; font-family: cursive;"></pre>

    <textarea id="Output" style="resize: none; height: 20%; width: 15%;" placeholder="OutPut for Code!"></textarea>
    <textarea id="Inputs" style="resize: none; height: 20%; width: 15%;"; placeholder="Inputs Here!"></textarea>

</body>

<script>
    // steps to make the whitespace compiler
    // ~~1. simple interface and ui that works'~~

    // ~~2. get tabs and spaces (ignore everything else)~~
    // ~~3. a way to see spaces and tabs (important else its hard to make programs)~~~~~ half working, it shows T for tab, s,and l
    // ~~4a. simple push~~
    // 4b. Side mission gonna add Stacks or try to so I can inplement addition and what not :D
    // 4c, addition, subtraction, printing
    // 5. add more features
    // 6. make it look pretty

    let Heap = [];
    let Stacks = [];
    let Instructions = [];

    let btn = document.getElementById("RunCode")

    let VStacks = document.getElementById("VStacks")

    let CodeInput = document.getElementById("CodeInput")

    let InstructionVisualiser = document.getElementById("InstructionVisualiser")  
    let LabelIds = [];

    function update(){
        let code = CodeInput.value.replace(/[^ \t\n]/g, "");
        let pointer = 0;
        let CallIndex=0;
        LabelIds = [];
        Heap = [];
        Stacks = [];
        Instructions = [];
        InstructionVisualiser.textContent=""

        function next() {
            return code[pointer++];
        }
        function back() {
            return code[pointer--];
        }
        function peek() {
            return code[pointer]
        }
        function previous(n=1){
            return  code[pointer -n]
        }
        

        function ReadNumber(Instruction){
            let binary = ""
            let sign = next()
            let i=0
            while (pointer < code.length && peek() != `\n`){
                binary += next() === "\t" ? "1" : "0";
            }
            next()

            let number = parseInt(binary, 2)

            if (sign === "\t"){number*=-1}
            if (Instruction === "Label" && !isNaN(number) && binary.length>0){

                let found = false;
                for (let i=0; LabelIds.length>i; i++){
                    if (LabelIds[i]===number){
                        found = true
                        InstructionVisualiser.textContent += `\n ${Instruction} (${number} already exists??)`
                        break
                    }
                }
                if (!found){
                    InstructionVisualiser.textContent += `\n ${Instruction} ${LabelIds.length}`                        
                    LabelIds.push(number)
                }

            } else if (Instruction === "Call" && !isNaN(number) && binary.length>0){ 
                console.log(LabelIds)
                Unresolved++

            } else if (["Jmp", "Jz", "Jn"].includes(Instruction) ){
                Unresolved++
            }else if (!isNaN(number) && binary.length>0){
                Instructions.push(Instruction, number);
                InstructionVisualiser.textContent += `\n ${Instruction} ${number} `;
            } else {
                InstructionVisualiser.textContent += `\n ${Instruction}`;}
        }

        function SendInstruction(Instruction){
            Instructions.push(Instruction)
            InstructionVisualiser.textContent += `\n ${Instruction}`;
        }


        function StackManipulation (){ 
            let Second = next()

            if (Second === " "){ 

                ReadNumber("Push")
            } else if (Second === `\t`){
                let third = next()
                if (third=== " "){
                    ReadNumber("Copy")
                } else if (third === `\n`){
                    ReadNumber("Slide")
                }
            } else if (Second=== `\n`){
                let third = next()
                if (third === `\t`){
                    SendInstruction("Swap")
                } else if (third === `\n`){
                    SendInstruction("Drop")
                } else if (third ===  " "){
                    SendInstruction("Dup")
                }
            }
        }

        function Arithmetic(){
            let third = next()
            if (third === " "){
                let fourth = next()
                if (fourth === " "){
                    SendInstruction("Add")
                } else if (fourth === `\t`){
                    SendInstruction("Sub")
                } else if (fourth === `\n`){
                    SendInstruction("Mul")
                }
            } else if (third === `\t`){
                let fourth = next()
                if (fourth === " "){
                    SendInstruction("Div")
                } else if (fourth === `\t`){
                    SendInstruction("Mod")
                }
            }
        }

        function HeapAccess(){
            let third = next()
            if (third === " "){
                SendInstruction("Store")
            } else if (third === `\t`){
                SendInstruction("Retrieve")
            }

        }

        function FlowControl(){
            let second = next()
            if (second === " "){
                let third = next()
                if (third === " "){
                    ReadNumber("Label");
                } else if (third === `\t`){
                    ReadNumber("Call")
                } else if (third === `\n`){
                    ReadNumber("Jmp")
                }
            } else if (second === `\t`){
                let third = next()
                if (third === " "){
                    ReadNumber("Jz")
                } else if (third === `\t`){
                    ReadNumber("Jn")
                } else if (third === `\n`){
                    SendInstruction("Return")
                }
            } else if (second === `\n`){
                let third = next()
                if (third === `\n`){
                    SendInstruction("End")
                }
            }
        }

        function IOparser(){
            let third = next()
            if (third === " "){
                let fourth = next()
                if (fourth === " "){
                    SendInstruction("OutChar")
                } else if (fourth === `\t`){
                    SendInstruction("OutNum")
                }
            } else if (third ===  `\t`){
                let fourth = next()
                if (fourth === " "){
                    SendInstruction("InpChar")
                } else if (fourth === `\t`){
                    SendInstruction("InpNum")
                }
            }
            

        }

        while (pointer < code.length){
            let first = next();

            if (first === " "){
                StackManipulation();
            } else if (first === "\t"){
                let second = next()
                if (second === " "){
                    Arithmetic()
                } else if (second === `\t`){
                    HeapAccess()
                } else if (second === `\n`){
                    IOparser()
                }
            } else if (first === `\n`){
                FlowControl()
            }
        }
    }



    CodeInput.addEventListener('keydown', function (event) {
        if (event.key=='Tab'){
            event.preventDefault();
            const start = this.selectionStart;
            const end = this.selectionEnd;
            this.value = this.value.substring(0,start) + `\t` + this.value.substring(end);
            this.selectionStart = this.selectionEnd = start + 1;
            Visualise();
            update();
        }
    })



    CodeInput.addEventListener('input', function() {
        Visualise();
        update();
    })



    btn.addEventListener('click', (event) => {
        let pos = 0;
        VStacks.textContent ="";
        while ( Instructions.length > 0 ){
            if (Instructions[0]=== "Push"){
                Instructions.shift()
                Stacks.push(Instructions[0])
                Instructions.shift()
            } else if (Instructions[0]==="Copy"){
                if (Stacks.length>0){
                    Instructions.shift()
                    Stacks.push(Stacks.slice().reverse()[Instructions[0]])
                    Instructions.shift()
                } else {
                    Instructions.shift()
                    Instructions.shift()
                    console.log("Stack size too small :(")
                }
            } else if (Instructions[0]=== "Slide"){
                Instructions.shift()
                Stacks.splice(Stacks.length - 1 - Instructions[0], Instructions[0])
                Instructions.shift()
            } else if (Instructions[0]=== "Swap"){
                Instructions.shift()
                let FirstNum = Stacks.pop()
                let SecondNum = Stacks.pop()
                Stacks.push(FirstNum)
                Stacks.push(SecondNum)

            } else if (Instructions[0]=== "Drop"){
                Instructions.shift()
                Stacks.pop()
            } else if (Instructions[0]=== "Dup"){
                Instructions.shift()
                Stacks.push(Stacks[Stacks.length - 1])
            } else if (Instructions[0]=== "Add"){
                Instructions.shift()
                if (Stacks.length>1){
                    let FirstNum = Stacks.pop()
                    let SecondNum = Stacks.pop()
                    Stacks.push(FirstNum+SecondNum)
                } else {
                    console.log("Not enough Stacks")
                }
            } else if (Instructions[0]=== "Sub"){
                Instructions.shift()
                if (Stacks.length>1){
                    let FirstNum = Stacks.pop()
                    let SecondNum = Stacks.pop()
                    Stacks.push(SecondNum-FirstNum)
                } else {
                    console.log("Not enough Stacks")
                }
            } else if (Instructions[0]=== "Mul"){
                Instructions.shift()
                if (Stacks.length>1){
                    let FirstNum = Stacks.pop()
                    let SecondNum = Stacks.pop()
                    Stacks.push(FirstNum*SecondNum)
                } else {
                    console.log("Not enough stacks")
                }
            } else if (Instructions[0]=== "Div"){
                Instructions.shift()
                if (Stacks.length>1){
                    let FirstNum = Stacks.pop()
                    let SecondNum = Stacks.pop()
                    if (FirstNum!=0){
                        Stacks.push(SecondNum/FirstNum)
                    }
                } else {
                    console.log("Not enough Stacks")
                }
            } else if (Instructions[0]=== "Mod"){
                Instructions.shift()
                if (Stacks.length>1){
                    let FirstNum = Stacks.pop()
                    let SecondNum = Stacks.pop()
                    if (FirstNum!=0){
                        Stacks.push(SecondNum%FirstNum)
                    }
                } else {
                    console.log("Not enough Stacks")
                }
            } else if (Instructions[0]=== "Store"){
                Instructions.shift()
                if (Stacks.length>1){
                    Heap[Stacks[Stacks.length-1]] = Stacks[Stacks.length-2]
                    Stacks.pop()
                    Stacks.pop()
                } else {
                    console.log("Not enough Stacks")
                }
            } else if (Instructions[0]=== "Retrieve"){
                Instructions.shift()
                if (Stacks.length>0){
                    Stacks.push(Heap[Stacks[Stacks.length-1]])
                }
            } else if (Instructions[0]==="OutChar"){
                
            } else if (Instructions[0]==="OutNum"){

            } else if (Instructions[0]==="InpChar"){

            } else if (Instructions[0]==="InpNum"){
                let InputBox = document.getElementById("Inputs").value.replace(/\D/g, "")

                if (InputBox.length>0){
                    Stacks[Stacks[Stacks.length-1]-1] = InputBox[pos]
                }
                Instructions.shift()
                pos++
            }
        }
        for (let i=0; i < Stacks.length; i++){
            if (Stacks[i] != undefined){
                VStacks.textContent += `[${Stacks[i]}]`
            } else {
                VStacks.textContent += `[U]`
            }
        }

    })



    function Visualise() {
        const Code = CodeInput.value;
        const filtered = Code.replace(/[^ \t\n]/g, "")
        document.getElementById("Visualise").textContent =
            filtered.replaceAll(" ", "S")
                .replaceAll("\t", "T")
                .replaceAll("\n", "L\n");
        
    }



</script>
