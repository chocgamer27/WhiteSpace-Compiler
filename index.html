<body>

    <textarea id="CodeInput" placeholder="Input your Code here!" style="height: 40%; width: 40%;"></textarea>
    <button id="RunCode" style="height: 100px; width: 100px;">RUN</button>
    <pre id="Visualise"></pre>
    <pre id="VStacks"></pre>
    <pre id="InstructionVisualiser" style="background-color: rgb(187, 187, 187); color: rgb(0, 0, 0); position: absolute; right: 1%; top: 0.1%; height: 45%; width: 15%; font-size: 15px; font-family: cursive;"></pre>


</body>

<script>
    // steps to make the whitespace compiler
    // ~~1. simple interface and ui that works'~~
    // ~~1a. Make it so you can click tab in there~~
    // ~~2. get tabs and spaces (ignore everything else)~~
    // ~~3. a way to see spaces and tabs (important else its hard to make programs)~~~~~ half working, it shows T for tab, s,and l
    // ~~4a. simple push~~
    // 4b. Side mission gonna add stacks or try to so I can inplement addition and what not :D
    // 4c, addition, subtraction, printing
    // 5. add more features
    // 6. make it look pretty

    let Stacks = []
    let Instructions = []

    let btn = document.getElementById("RunCode")

    let VStacks = document.getElementById("VStacks")

    let CodeInput = document.getElementById("CodeInput")

    let InstructionVisualiser = document.getElementById("InstructionVisualiser")    

    function update(){
        let code = CodeInput.value.replace(/[^ \t\n]/g, "");
        let pointer = 0;
        InstructionVisualiser.textContent=""
        Instructions = []
        Stacks = []

        function next() {
            return code[pointer++];
        }
        function back() {
            return code[pointer];
        }

        function StackManipulation (pointer){ // my solution to fixing this ass code is to make a function for 
                                         // stack manip, arthimetic, heapacess, flow controll, i/o :D
            let Second = next()
            let Third = next()
            //" ": "Push",
            //"\t ": "Copy",
            //"\t\n": "Slide",
            //"\n\t": "Swap",
            //"\n\n": "Drop",
            //"\n ": "Dup"

        if (Second === " "){
            // third if its a tab would mean its negative and if its a space its positive

            Instructions.push("Push");
            InstructionVisualiser.textContent += `\nPush`;
        } else if (Second === `\t`){
            if (Third=== " "){
                console.log("Copy")
            } else if (Third === `\n`){
                console.log("Slide")
            }
        } else if (Second=== `\n`){
            if (Third === `\t`){
                console.log("Swap")
            } else if (Third === `\n`){
                console.log("Drop")
            } else if (Third ===  " "){
                console.log("Dup")
            }
        }
        }


        while (pointer < code.length){

            let first = next();

            if (first === " "){
                StackManipulation()
            } else if (first === "\t" && next() === " "){
                
                let operation = code.slice(pointer, pointer+2);
                pointer +=2;

                let operations = {
                    "  ": "Add",
                    " \t": "Sub",
                    " \n": "Mul",
                    "\t ": "Div",
                    "\t\t": "Mod"
                };
                if (operations[operation]){
                    Instructions.push(operations[operation]);
                    InstructionVisualiser.textContent += `\n${operations[operation]}`;
                }
            }

        }
    }



    CodeInput.addEventListener('keydown', function (event) {
        if (event.key=='Tab'){
            event.preventDefault();
            const start = this.selectionStart;
            const end = this.selectionEnd;
            this.value = this.value.substring(0,start) + `\t` + this.value.substring(end);
            this.selectionStart = this.selectionEnd = start + 1;
            Visualise();
            update();
        }
    })



    CodeInput.addEventListener('input', function() {
        Visualise();
        update();
    })



    btn.addEventListener('click', (event) => {
        
        while ( Instructions.length > 0 ){
            console.log(Instructions[0])
            console.log(Stacks)
            if (Instructions[0] == "Push"){
                Instructions.shift()
                Stacks.push(Number(Instructions[0]))
                Instructions.shift()
            } else if (Instructions[0] == "Dup"){
                Instructions.shift()
                Stacks.push(Number(Instructions[0]))
                Instructions.shift()
            } else if (Instructions[0] == "Add"){
                if (Stacks.length>1){
                    let number1 = Stacks.pop(Stacks.length-1)
                    let number2 = Stacks.pop(Stacks.length)
                    Stacks.push(number1+number2)
                    Instructions.shift()
                }
            } else if (Instructions[0] == "Sub"){
                if (Stacks.length>1){
                    let number1 = Stacks.pop(Stacks.length-1)
                    let number2 = Stacks.pop(Stacks.length)
                    Stacks.push(number1-number2)
                    Instructions.shift()
                }
            } else if (Instructions[0] == "Mul"){
                if (Stacks.length>1){
                    let number1 = Stacks.pop(Stacks.length-1)
                    let number2 = Stacks.pop(Stacks.length)
                    Stacks.push(number1*number2)
                    Instructions.shift()
                }
            } else if (Instructions[0] == "Div"){
                if (Stacks.length>1){
                    let number1 = Stacks.pop(Stacks.length-1)
                    if (number1!=0){
                        let number2 = Stacks.pop(Stacks.length)
                        Stacks.push(Math.round(number1/number2))
                        Instructions.shift()
                    }
                }
            } else if (Instructions[0] == "Mod"){
                if (Stacks.length>1){
                    let number1 = Stacks.pop(Stacks.length-1)
                    if (number1!=0){
                        let number2 = Stacks.pop(Stacks.length)
                        Stacks.push(number1%number2)
                        Instructions.shift()
                    }
                }
            }
            VStacks.textContent = `Stacks: \n`
            for (let i = 0; Stacks.length > i; i++){
                VStacks.textContent = `[${Stacks[i]}]`
            }
        }

    })



    function Visualise() {
        const Code = CodeInput.value;
        const filtered = Code.replace(/[^ \t\n]/g, "")
        document.getElementById("Visualise").textContent =
            filtered.replaceAll(" ", "S")
                .replaceAll("\t", "T")
                .replaceAll("\n", "L\n");
        
    }



</script>
